[project]
name = "transcriber"
authors = [{ name = "Michal Galuszka" }]
version = "0.3.0"
description = "Audio transcription tool using WhisperX for meeting recordings"
requires-python = ">=3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transcriber"]

# ---------------------------------------------------------------------------
# DEPENDENCIES
# ---------------------------------------------------------------------------

dependencies = []

[project.optional-dependencies]
ml = [
    "whisperx==3.8.1",
    "torch==2.8.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.9.1",
    "av>=16.1.0",
    "hf_xet>=1.2.0",
    "nltk>=3.9.3",
]
cli = ["transcriber[ml]", "rich>=14.3.2"]
server = [
    "transcriber[ml]",
    "python-multipart>=0.0.22",
    "fastapi>=0.135.1",
    "uvicorn[standard]>=0.41.0",
]
client = ["sounddevice>=0.5.5", "httpx>=0.28.1", "websockets>=16.0"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.1",
    "rust-just>=1.46.0",
    "bandit>=1.9.3",
    "pip-audit>=2.10.0",
    "detect-secrets>=1.5.0",
    "ty>=0.0.17",
    "httpx>=0.28.1",
    "websockets>=16.0",
]
commit = ["commitizen>=4.13.8", "pre-commit>=4.5.1"]

# ---------------------------------------------------------------------------
# SCRIPTS
# ---------------------------------------------------------------------------

[project.scripts]
trans-cli = "transcriber.cli.app:main"
trans-server = "transcriber.server.app:main"
trans-cache = "transcriber.cli.cache:main"


# ---------------------------------------------------------------------------
# Tool configurations
# ---------------------------------------------------------------------------

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[tool.bandit]
targets = ["src"]
severity = "all"
exclude_dirs = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "D",   # pydocstyle
    "ANN", # flake8-annotations
    "S",   # flake8-bandit
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "D100",   # missing docstring in public module
    "D104",   # missing docstring in public package
    "S101",   # use of assert (needed for tests)
    "ANN401", # typing.Any allowed for untyped third-party wrappers
]

[tool.ruff.lint.isort]
known-first-party = ["transcriber"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "ANN", "S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
norecursedirs = ["__pycache__", ".git", ".venv"]
addopts = ["-v", "--tb=short", "-m", "not integration"]
markers = ["integration: requires a running transcription server"]
filterwarnings = [
    "ignore:std\\(\\).*degrees of freedom:UserWarning",
    "ignore:[\\s\\S]*torchcodec is not installed:UserWarning",
    "ignore::DeprecationWarning:websockets",
]

[tool.coverage.run]
source = ["src/transcriber"]
omit = ["*/tests/*", "*/__pycache__/*", "*/.venv/*", "*/__init__.py"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 70

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
tag_format = "v$version"
version_files = ["pyproject.toml:version"]

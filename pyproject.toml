[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transcriber"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchaudio = [{ index = "pytorch-cu128" }]

[project]
name = "transcriber"
authors = [{ name = "Michal Galuszka" }]
version = "0.1.0"
description = "Audio transcription tool using WhisperX for meeting recordings"
requires-python = "==3.12.*"

dependencies = [
    "whisperx==3.8.1",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "pydantic>=2.12.5",
    "rich>=14.3.2",
    "av>=16.1.0",
    "hf_xet>=1.2.0",
    "python-dotenv>=1.2.1",
]

[project.scripts]
transcriber = "transcriber.cli.app:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.1",
    "rust-just>=1.46.0",
    "bandit>=1.9.3",
    "pip-audit>=2.10.0",
    "detect-secrets>=1.5.0",
    "ty>=0.0.17",
]
commit = ["commitizen>=4.13.8", "pre-commit>=4.5.1"]

# ---------------------------------------------------------------------------
# Tool configurations
# ---------------------------------------------------------------------------

[tool.bandit]
targets = ["src"]
severity = "all"
exclude_dirs = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "D",   # pydocstyle
    "ANN", # flake8-annotations
    "S",   # flake8-bandit
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "D100",   # missing docstring in public module
    "D104",   # missing docstring in public package
    "S101",   # use of assert (needed for tests)
    "ANN401", # typing.Any allowed for untyped third-party wrappers
]

[tool.ruff.lint.isort]
known-first-party = ["transcriber"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "ANN", "S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
norecursedirs = ["__pycache__", ".git", ".venv"]
addopts = ["-v", "--tb=short"]

[tool.coverage.run]
source = ["src/transcriber"]
omit = ["*/tests/*", "*/__pycache__/*", "*/.venv/*", "*/__init__.py"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 70

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
tag_format = "v$version"
version_files = ["pyproject.toml:version"]
